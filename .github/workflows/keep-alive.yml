name: keep-alive

# Pings the deployed API once an hour so Render's free instance gets regular traffic.
# Runs at 7 minutes past each hour (UTC); GitHub may start scheduled runs a few minutes late.
# Note: a free Render instance still sleeps after 15 minutes without traffic, so between pings
# the first visit can take 30-60 s to wake it. Change the cron to '*/14 * * * *' to keep it
# awake all the time (about 744 instance hours a month, within the free 750).
# Can also be run by hand: Actions -> keep-alive -> Run workflow.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          HEALTH_URL: https://makepatternbakend.onrender.com/api/health
        run: |
          # A sleeping instance can take up to a minute to answer, so allow time and retry.
          for attempt in 1 2 3; do
            code=$(curl -s -o response.json -w '%{http_code}' --max-time 90 "$HEALTH_URL" || echo 000)
            echo "Attempt $attempt: HTTP $code $(cat response.json 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Backend did not answer with 200 after 3 attempts"
          exit 1
